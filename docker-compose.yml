services:
  supply:
    build: .
    image: after-sales-supply:latest
    ports:
      - "${SUPPLY_PORT:-8000}:8000"
    environment:
      SUPPLY_DB: /data/supply.db
    volumes:
      - supply-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  supply-data:
